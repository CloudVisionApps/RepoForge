name: Package Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deb-rpm:
    name: ${{ matrix.goarch }} (.deb + .rpm)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install FPM and rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby-dev build-essential rpm file

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Build FPM packages
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
          VERSION: ${{ github.ref_name }}
          URL: ${{ github.server_url }}/${{ github.repository }}
        run: ./packaging/build-packages.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/out/*.deb
            packaging/out/*.rpm
